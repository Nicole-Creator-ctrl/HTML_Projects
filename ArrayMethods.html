<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>join() and pop ()</h2>
        <p>The join() method joins all elements of an array into a
            string. The pop() method removed the last element of an array and returns that element. This methods changed the legth of the array.
        </p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits = ["Banana", "Orange", "Apple", "Mango"];
            document.getElementById("myjoin").innerHTML = fruits.join("*");
            document.getElementById("myfirstpop").innerHTML =fruits;
            document.getElementById("mysecondpop").innerHTML =fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits;
        </script>
    

    </body>
</html>
