<!DOCTYPE html>
<html>

<head>
    <title>My Animal Fact File</title>
  <style>

    body {
        background-color: rgb(217, 228, 217);
        font-family: Arial, Helvetica, sans-serif;
    }

    .fact-file {
        background-color: lightyellow;
        color: darkslategray;
        width: 260px;
        padding: 25px;
        border: 4px solid rgb(226, 109, 6);
        margin: 30px;
    }

    .animal-name{
        color: rgb(171, 84, 3);
        font-size: 22px;
    }
    .animal-name::first-letter {
        color: rgb(128, 83, 52);
        font-size: 29px;
    }
    .detail {
        color:darkslategray;
    }

    .cool-fact {
        color:darkorange;
        font-style: italic;
    }
    .fact-file2 {
        background-color: lightyellow;
        color: darkslategray;
        width: 260px;
        padding: 25px;
        border: 4px solid rgb(92, 92, 208);
        margin: 30px;
    }
    .animal-name2 {
        color:rgb(92, 92, 208);
        font-style: italic;
    }
    .animal-name2::first-letter {
        color:rgb(31, 23, 149);
        font-size: 29px;
    }
    .detail2 {
        color: darkslategray
    }
    .cool-fact2 {
        color:turquoise;
    }
  </style>
</head>

<body>

    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap uo to 15 metres in one jump</p>
    </div>
     <div class="fact-file2">
        <h2 class="animal-name2">Shark</h2>
        <p class="detail2">Lifespan: 20-30 years</p>
        <p class="detail2">Scientific name: Selachimorpha</p>
        <p class="detail2">Diet: fish,squid, and crustaceans</p>
        <p class="cool-fact2">Cool Fact: Sharks do not have bones!</p>

    </div>
</body>

</html>
