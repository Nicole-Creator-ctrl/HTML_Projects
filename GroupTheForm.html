<!DOCTYPE html>
<html>
       
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width">
    <title>Personal Information Form</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>

<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label>Full Name:</label>
            <input type="text" id="fname" placeholder="Enter Name"><br><br>
            <label>Email:</label>
            <input type="text" id="email"><br><br>
            <label>Gender</label><br>
            <input type="radio" id="gender" value="Female">Female<br>
            <input type="radio" id="gender" value="Male">Male<br>
            <input type="radio" id="gender" value="Transgender">Transgender<br><br>
            <label>Birthday</label>
            <input type="date" id="birthday" name="Birthday"><br><br>
        </fieldset>
    </form>
</body>
</html>
