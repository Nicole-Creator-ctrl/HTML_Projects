<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width-device-width" />
        <title>Lists</title>
    </head>

    <body>
        <h2>An ordered HTML list:</h2>
        <ol>
            <li>Milk</li>
            <li>Bread</li>
            <li>Fruit</li>
            <li>Vegetables</li>
            <li>Candy</li>
        </ol>

        <h2>An unordered HTML list:</h2>
        <ul>
            <li>Lab coat</li>
            <li>Gloves</li>
            <li>Test tubed</li>
            <li>Mask</li>
        </ul>

        <h2>Definition List</h2>
        <dl>
            <dt>Shirt</dt>
            <dd>Plain white shirt</dd>

            <dt>Pants</dt>
            <dd>Brown pants</dd>
        </dl>
    </body>
</html>
