<!DOCTYPE html>
<html>

<head>
    <title>My Super Hero Card</title>
    <style>

        body {
            background-color:rgb(16, 48, 166);
            color:white;
            font-family:Georgia, 'Times New Roman', Times, serif;
        }

        .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orangered;
        }

        .tagline {
            font-weight: bold;
            font-style: italic;
            color:crimson;
            text-transform: capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration:underline;
            color:orangered;
        }

        .power {
            font-weight: bold;
            color:yellow;
        }
        .weakness {
            text-decoration: line-through;
            color:yellow;
        }

        .badge {
            font-size:28px;
            font-weight: bold;
            color:goldenrod;
            transform: rotate(15 deg);
        }

        .made-by {
            color:red;
            font-family:fantasy;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weaknesses">Maths Homework</p>
    <p class="weaknesses">Broccoli</p>

    <p class="badge">Top Hero</p>

    <p class="made by">Created by Nicole Emma Diaz Rivera</p>
</body>
</html>
