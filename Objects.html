<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Phone Contacts</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 

        rel="sytlesheet">
        <style>
         
       body {
        background-color: rgb(190, 238, 255);
       }
       h1 {
        color:rgb(30, 150, 255);
        text-decoration: underline;
       }
       h6, h5 {
        text-decoration: underline;
       }
       .card-label {
        font-size: 11px; color:rgb(17, 131, 230);
       }
      pre {
        font-size: 13px; color: black;
      }
        </style>
    </head>
    <body class="py-4">
        <div class="container">
            <h1 class="mb-1">My Phone Contact</h1>
            <p class="text-muted mb-4">
                Intoduction to Objects in JavaScript (Grade 4-6).
            </p>
            <div class="card shadow-sm mb-3" style="max-width:400px">
                <div class="card-body">
                    <h5 class="class title" style="color:rgb(0, 136, 255)">Contact Details</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>
                        <li class="list-group-item">
                           <span class="card-label d-block">Phone</span>
                           <strong id="phone">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">School</span>
                            <strong id="school">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">City</span>
                            <strong id="city">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">Mother's Name</span>
                            <strong id="MotherName">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">Father's Name</span>
                            <strong id="FatherName">-</strong>
                        </li>
                    </ul>
                </div>
            </div>
        
     
        <div class="card shadow-sm" style="max-width:400px;">
            <div class="card-body">
                <h6 style="color:rgb(71, 162, 241);">JavaScript Object Used</h6>
                <pre id="CodeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>

 </div>
 <script>
     var myContact = {
        name: "Emma Nicole Diaz",
        phone: "+591 123 456789",
        school: "Calvert Cochabamba Cooperative School",
        city: "Cochabamba",
        MotherName : "Ana Emilia Rivera",
        FatherName : "Daniel Diaz",
     };
     var nameE1 = document.getElementById("name");
     var phoneE1 = document.getElementById("phone");
     nameE1.textContent = myContact.name;
     phoneE1.textContent = myContact.phone;
     var motherNameE1 = document.getElementById("MotherName");
     var fatherNameE1 = document.getElementById("FatherName");
     var schoolE1 = document.getElementById("school");
     var cityE1 = document.getElementById("city");
    motherNameE1.textContent = myContact["MotherName"];
    fatherNameE1.textContent = myContact["FatherName"];
    schoolE1.textContent = myContact["school"];
    cityE1.textContent = myContact["city"];

    var CodeE1 = document.getElementById("CodeDisplay");
    CodeE1.textContent =
    'var myContact = {\n' +
        '    name: "' + myContact.name + '",\n' +
        '    phone: "' + myContact.phone + '",\n' +
        '    school: "' + myContact["school"] + '",\n' +
        '    city: "' + myContact["city"] + '",\n' +
        '    MotherName: "' + myContact["MotherName"] + '",\n' +
        '    FatherName: "' + myContact["FatherName"] + '"\n' +
        '};';
 </script>

    </body>
</html>
