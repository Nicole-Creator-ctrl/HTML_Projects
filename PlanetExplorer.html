<!DOCTYPE html>
<html lan="en">
    <head>
        <title>My Planet Explorer</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body { background-color: white;}
            .navbar { background-color: darkblue;}
            .navbar-brand, .nav-link { color: white !important;}
            .section-title { color:darkblue; margin: 20px 0 10px; font-weight: bold; font-size:large;}
        </style>
    </head>

    <body>

        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
            <a class="navbar-brand" href="#">My Planet Explorer</a>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Planets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Stars</a>
                </li>
            </ul>
        </nav>

        <div class="container mt-4">

            <h4 class="section-title">Scanning the Galazy...</h4>
            <div class="spinner-border text-primary" role="status"></div>
            <div class="spinner-border text-warning" role="status"></div>
            <div class="spinner border text-danger" role="status"></div>

            <h4 class="section-title">Featured Planets</h4>
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Earth</h5>
                            <p class="card text">Our home planet, the only one known to sustain life!</p>
                            <a href="#" class="btn btn-primary">Explore</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Jupiter</h5>
                            <p class="card-text">The largest planet in our solar system, known for its Great Red Spot.</p>
                            <a href="#" class="btn btn-warning">Explore</a>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="section-title">Browse more Planets</h4>
            <ul class="pagination">
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </div>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </body>
</html>
