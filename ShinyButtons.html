<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shiny Buttons</title>
    </head>
    <style>
        button {
            position: absolute;
            top: 40%;
            left: 50%;
            width: 200px;
            height: 50px;
            text-align: center;
            background: black;
            color: white;
            font-family: "Gill Sans", "Gill Sans MT", "Calibri", "Trebuchet MS", sans-serif;
            border-radius: 60px;
            border: 4px solid black;
            box-shadow: inset 0 0 3px rgb(97, 96, 96);
        }
        button ::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10px;
            width: 70%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            transition: 0.5s;
            transform: skewX(-15deg);
        }
        button :hover::before {
            left: 190px;
        }
    button ::after {
       content: ""; 
       position: absolute;
       top: 0;
       left: -70px;
       width: 50px;
       height: 100%;
       background: rgba(255,255,255,0.1);
       transition: 0.5s;
       transform: skewX(-15deg);
    }
    button :hover::after {
        left: 190px;
    }
    </style>

    <body>
       <button>THIS IS A SHINY BUTTON</button> 
    </body>

</html>
