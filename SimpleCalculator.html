<!DOCTYPE html>
<html>

<body>

    <h1>Simple Calculator</h1>
    <p>Perform all Operations using JavaScript</p>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>

    <script>
        var num1 = 10;
        var num2 = 2;

           document.getElementById("add").innerHTML =
                "The added value is: " + (num1 + num2);
            document.getElementById("sub").innerHTML =
                "The subtracted value is: " + (num1 - num2);
            document.getElementById("mul").innerHTML =
                "The multiplied value is: " + (num1 * num2);
            document.getElementById("div").innerHTML =
                "The divided value is: " + (num1 / num2);
    </script>
